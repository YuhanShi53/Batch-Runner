# JSON Loader Configuration Example
# For loading prompts from a JSON file

loader:
  class: JSONDataLoader
  params:
    file_path: data/prompts.json
    prompt_field: text  # Field containing the prompt
    id_field: request_id  # Field containing the ID

saver:
  class: JSONResultSaver
  params:
    output_path: outputs/results.json
    batch_size: 50
    pretty_print: true

runner:
  max_concurrency: 10
  max_retries: 3
  num_rollouts: 3  # Run each sample 3 times
  model_name: meta-llama/Llama-2-7b-chat-hf
  temperature: 0.8
  max_tokens: 2000
  servers_dir: ./vllm_servers
  load_balancing_strategy: round_robin

logging:
  level: INFO
  file: logs/batch_runner.log
