# Minimal vLLM Batch Runner Configuration
# Uses PromptListLoader and ConsoleResultSaver for quick testing

loader:
  class: PromptListLoader
  params:
    prompts:
      - "What is the capital of France?"
      - "Explain quantum computing in simple terms"
      - "Write a haiku about artificial intelligence"

saver:
  class: ConsoleResultSaver
  params:
    show_details: false

runner:
  max_concurrency: 5
  model_name: gpt-3.5-turbo
  servers_dir: ./vllm_servers

logging:
  level: INFO
