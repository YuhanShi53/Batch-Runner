# Directory JSONL streaming example
# Uses the current bounded producer/scheduler/writer pipeline.

loader:
  class: DirectoryJSONLDataLoader
  params:
    input_dir: data/input
    file_pattern: conv.jsonl
    prompt_field: prompt
    id_field: id
    recursive: true
    streaming: true

saver:
  class: DirectoryJSONLResultSaver
  params:
    output_dir: data/output
    output_file_pattern: result.jsonl
    preserve_structure: true
    output_projection: minimal
    immediate_flush: false

runner:
  max_concurrency: 256
  max_retries: 2
  retry_delay: 0.5
  request_timeout: 180

  http_max_connections: 512
  http_max_keepalive_connections: 128
  http2: true

  model_name: meta-llama/Llama-2-7b-chat-hf
  temperature: 0.7
  max_tokens: 1000
  system_prompt: ""
  top_p: 1.0
  frequency_penalty: 0.0
  presence_penalty: 0.0

  servers_dir: ./vllm_servers
  load_balancing_strategy: p2c_cost_aware
  selection_sample_size: 2
  max_active_requests: 128
  max_inflight_cost: 0

  health_check_interval: 30
  max_failures: 5
  allow_unhealthy_fallback: false
  success_rate_threshold: 0.5
  success_rate_window: 10

  adapter_class: OpenAIAdapter
  adapter_params: {}

  progress_report_interval: 10
  streaming: true
  producer_prefetch: 512
  writer_queue_size: 1024
  writer_batch_size: 128
  writer_flush_interval_ms: 100
  writer_workers: 1

  resume: true
  resume_backend: bitmap

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/batch_runner.log
