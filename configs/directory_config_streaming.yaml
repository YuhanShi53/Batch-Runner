# vLLM Batch Runner Configuration - Directory Tree Mode (Streaming Pipeline)
# This configuration uses a streaming pipeline to process large datasets efficiently.
# Data is loaded, processed, and saved concurrently with minimal memory footprint.

# DataLoader Configuration
loader:
  class: DirectoryJSONLDataLoader
  params:
    input_dir: data/input  # Root directory containing conv.jsonl files
    file_pattern: conv.jsonl  # File pattern to search for (default: conv.jsonl)
    prompt_field: prompt  # Field name containing the prompt text
    id_field: id  # Field name containing the ID
    recursive: true  # Whether to search subdirectories (default: true)
    streaming: true  # Enable streaming mode (default: true)

# ResultSaver Configuration
saver:
  class: DirectoryJSONLResultSaver
  params:
    output_dir: data/output  # Root output directory
    output_file_pattern: result.jsonl  # Default output filename
    preserve_structure: true  # Mirror input directory structure (default: true)

# Batch Runner Configuration
runner:
  # Concurrency settings
  max_concurrency: 10
  max_retries: 3
  retry_delay: 1.0
  request_timeout: 120

  # Model parameters
  model_name: meta-llama/Llama-2-7b-chat-hf
  temperature: 0.7
  max_tokens: 1000
  system_prompt: ""  # Optional: Set a system prompt for all requests
  top_p: 1.0
  frequency_penalty: 0.0
  presence_penalty: 0.0

  # Server configuration
  servers_dir: ./vllm_servers
  load_balancing_strategy: round_robin  # Options: round_robin, least_connections, random

  # Health check configuration
  health_check_interval: 30  # Seconds between health checks
  max_failures: 5  # Max consecutive failures before marking server as unhealthy
  allow_unhealthy_fallback: false  # If true, allows routing to unhealthy servers when no healthy ones available

  # Success rate tracking (for least_connections strategy)
  success_rate_threshold: 0.5  # Minimum success rate (0.0-1.0) for server to be preferred
  success_rate_window: 10  # Number of requests needed before success rate is considered reliable

  # Model adapter configuration
  adapter_class: OpenAIAdapter  # Options: OpenAIAdapter, SimpleAdapter, or custom
  adapter_params: {}  # Additional parameters to pass to adapter

  # Progress tracking
  progress_report_interval: 10

  # === STREAMING CONFIGURATION ===
  # Enable streaming mode for pipeline processing
  streaming: true  # Set to false to use legacy batch mode (preload all data)

  # Queue size for backpressure control
  # - Larger values = more memory usage, but better throughput
  # - Smaller values = less memory usage, but may slow down processing
  # - Recommended: 2-3x max_concurrency for optimal balance
  stream_queue_size: 100  # Default: 100

# Logging Configuration
logging:
  level: INFO  # Options: DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/batch_runner.log
