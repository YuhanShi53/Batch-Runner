# vLLM Batch Runner Configuration - Directory Tree Mode with Multimodal Support
# This configuration reads conv.jsonl files from a directory tree with image support
# and writes results to an output directory while preserving the directory structure.

# DataLoader Configuration
loader:
  class: MultimodalDirectoryJSONLDataLoader  # Use multimodal version for image support
  params:
    input_dir: data/input  # Root directory containing conv.jsonl files
    file_pattern: conv.jsonl  # File pattern to search for (default: conv.jsonl)
    prompt_field: prompt  # Field name containing the text prompt
    id_field: id  # Field name containing the ID
    image_field: image  # Field name for single image (default: "image")
    images_field: images  # Field name for multiple images (default: "images")
    # image_base_dir: ""  # Optional: base directory for relative image paths
                            # If not specified, images are resolved relative to each conv.jsonl file's directory
    encode_images: true  # Whether to encode images to base64 (default: true)
    recursive: true  # Whether to search subdirectories (default: true)

# Expected conv.jsonl format examples:
#
# Text-only:
# {"id": "1", "prompt": "What is AI?"}
#
# Single image (relative path - resolved from conv.jsonl file's directory):
# {"id": "2", "prompt": "Describe this image", "image": "images/photo.jpg"}
#
# Multiple images:
# {"id": "3", "prompt": "Compare these images", "images": ["img1.jpg", "img2.png"]}
#
# Image field precedence: "image" takes priority over "images"
# {"id": "4", "prompt": "What's in this image?", "image": "photo.jpg", "images": ["other.jpg"]}
# This will only use photo.jpg

# ResultSaver Configuration
saver:
  class: DirectoryJSONLResultSaver
  params:
    output_dir: data/output  # Root output directory
    output_file_pattern: result.jsonl  # Default output filename
    preserve_structure: true  # Mirror input directory structure (default: true)
    # Optional: Custom output filename pattern
    # Use {source} to reference the source filename without extension
    # Examples:
    #   output_filename: "{source}.out"  # conv.jsonl -> conv.jsonl.out
    #   output_filename: "result_{source}.jsonl"  # conv.jsonl -> result_conv.jsonl
    #   output_filename: "results.jsonl"  # Always use results.jsonl

# Batch Runner Configuration
runner:
  # Concurrency settings
  max_concurrency: 10
  max_retries: 3
  retry_delay: 1.0
  request_timeout: 120

  # Rollouts (number of times to run each sample)
  num_rollouts: 1

  # Model parameters (use a vision-capable model)
  model_name: meta-llama/Llama-3.2-11B-Vision-Instruct  # Example vision model
  temperature: 0.7
  max_tokens: 1000
  system_prompt: ""  # Optional: Set a system prompt for all requests
  top_p: 1.0
  frequency_penalty: 0.0
  presence_penalty: 0.0

  # Server configuration
  servers_dir: ./vllm_servers
  load_balancing_strategy: round_robin  # Options: round_robin, least_connections, random

  # Health check configuration
  health_check_interval: 30  # Seconds between health checks
  max_failures: 5  # Max consecutive failures before marking server as unhealthy
  allow_unhealthy_fallback: false  # If true, allows routing to unhealthy servers when no healthy ones available

  # Model adapter configuration
  adapter_class: OpenAIAdapter  # Options: OpenAIAdapter, SimpleAdapter, or custom
  adapter_params: {}  # Additional parameters to pass to adapter

  # Progress tracking
  progress_report_interval: 10

# Logging Configuration
logging:
  level: INFO  # Options: DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/batch_runner.log
