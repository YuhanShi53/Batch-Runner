# Multimodal example configuration

loader:
  class: MultimodalJSONLDataLoader
  params:
    file_path: data/vision_prompts.jsonl
    prompt_field: prompt
    id_field: id
    image_field: image
    images_field: images
    image_base_dir: data/images
    encode_images: true
    image_encode_workers: 8

saver:
  class: JSONLResultSaver
  params:
    output_path: results/vision_results.jsonl
    output_projection: minimal
    immediate_flush: false

runner:
  model_name: llava-hf/llava-1.5-7b-hf
  temperature: 0.7
  max_tokens: 512
  system_prompt: "You are a helpful vision assistant."

  max_concurrency: 32
  max_retries: 2
  retry_delay: 1.0
  request_timeout: 180

  http_max_connections: 128
  http_max_keepalive_connections: 64
  http2: true

  servers_dir: ./servers
  load_balancing_strategy: p2c_cost_aware
  selection_sample_size: 2
  max_active_requests: 64

  health_check_interval: 30
  max_failures: 5
  allow_unhealthy_fallback: false

  progress_report_interval: 5
  streaming: true
  producer_prefetch: 128
  writer_queue_size: 256
  writer_batch_size: 64
  writer_flush_interval_ms: 100
  writer_workers: 1
  resume: true
  resume_backend: bitmap
  image_encode_workers: 8

  adapter_class: OpenAIAdapter

logging:
  level: INFO
  file: logs/vision_inference.log
